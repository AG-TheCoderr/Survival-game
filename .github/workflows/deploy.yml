name: deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local module imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd().resolve()
          pending = [Path('index.html'), Path('lib/three.js')]
          seen = set()
          while pending:
              source = pending.pop().resolve()
              if source in seen or not source.is_file():
                  continue
              seen.add(source)
              imports = re.findall(
                  r"(?:from\s+|import\s*)['\"](\./[^'\"]+)['\"]",
                  source.read_text(),
              )
              for specifier in imports:
                  dependency = (source.parent / specifier).resolve()
                  if not dependency.is_file():
                      raise SystemExit(
                          f"Missing JS import {specifier!r} referenced by "
                          f"{source.relative_to(root)}"
                      )
                  pending.append(dependency)
          print(f"All local module imports resolve ({len(seen)} files checked)")
          PY

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B gh-pages
          git rm -rf --cached . 2>/dev/null || true
          git add index.html lib/ README.md
          git commit -m "Deploy to GitHub Pages"
          git push origin gh-pages --force
